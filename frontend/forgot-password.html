<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nushift — Reset your password to access your role workspace."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Forgot Password | Nushift</title>

    <!-- Favicon: 32px gradient circle -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238B7BFF'/%3E%3Cstop offset='100%25' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Sora & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-paint Theme Script -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nushift_theme') || localStorage.getItem('lfae_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh;">
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Sticky Header -->
    <header class="site-header" role="banner">
      <a href="index.html" class="brand-logo" aria-label="Nushift Home">
        <span class="logo-core-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <span>Nushift</span>
      </a>

      <div class="header-right">
        <button
          type="button"
          class="btn btn-theme-toggle btn-circle"
          data-theme-toggle
          aria-label="Switch theme"
        ></button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">
      <div style="width: 100%; max-width: 480px; text-align: center;">
        <div class="glass-card card-pad-lg" style="box-shadow: var(--shadow-md);">
          <span class="eyebrow" style="margin-bottom: 12px; display: inline-block;">RECOVERY</span>
          <h1 class="h2-title" style="margin-bottom: 8px;">Reset password</h1>
          <p class="caption" style="margin-bottom: 24px;">
            Enter your registered work email to receive a governed portal reset link.
          </p>

          <!-- Success Banner -->
          <div
            id="forgot-success"
            style="
              display: none;
              flex-direction: column;
              align-items: center;
              gap: 16px;
              padding: 24px;
              background: var(--status-success-bg);
              border: 1px solid var(--status-success-fg);
              border-radius: var(--r-14);
              color: var(--status-success-fg);
            "
          >
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <div>
              <div style="font-weight: 600; font-size: 15px;">Check your inbox</div>
              <div style="font-size: 13px; margin-top: 4px; color: var(--fg);">The reset link is on its way.</div>
            </div>
            <a href="login.html" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
              Back to sign in
            </a>
          </div>

          <!-- Form -->
          <form id="forgot-form" novalidate>
            <div class="form-group">
              <label for="forgot-email" class="form-label">Work email</label>
              <input
                id="forgot-email"
                type="email"
                class="form-input"
                placeholder="name@firm.internal"
                autocomplete="email"
                required
              />
              <div id="forgot-email-error" class="field-error-msg" style="display: none;"></div>
            </div>

            <button
              type="submit"
              id="forgot-submit-btn"
              class="btn btn-primary btn-lg"
              style="width: 100%; margin-top: 8px; margin-bottom: 20px;"
            >
              <span>Send reset link</span>
            </button>

            <a href="login.html" style="color: var(--lk); font-size: 14px; font-weight: 500;">
              Back to sign in
            </a>
          </form>
        </div>
      </div>
    </main>

    <footer style="text-align: center; padding: 24px 16px; border-top: 1px solid var(--bd); font-size: 13px; color: var(--mu);">
      <p>© 2026 Nushift. Law, tax and compliance, shifted into one intelligent workspace.</p>
    </footer>

    <script type="module" src="./src/forgot.js"></script>
  </body>
</html>
