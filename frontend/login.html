<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nushift — Law, tax and compliance, shifted into one intelligent workspace. Step 2: Sign in."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in | Nushift</title>

    <!-- Favicon: 32px gradient circle -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238B7BFF'/%3E%3Cstop offset='100%25' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Sora & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-paint Theme Script -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nushift_theme') || localStorage.getItem('meridian_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Sticky Header (Image 4) -->
    <header class="site-header" role="banner">
      <a href="index.html" class="brand-logo" aria-label="Nushift Home">
        <span class="logo-core-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </span>
        <span>Nushift</span>
      </a>

      <div class="header-right">
        <button
          type="button"
          class="btn btn-theme-toggle btn-circle"
          data-theme-toggle
          aria-label="Switch theme"
        ></button>
        <a href="roles.html" class="btn btn-ghost" style="height: 40px; padding: 0 18px;">
          Sign in
        </a>
      </div>
    </header>

    <!-- Main Content: Two Columns Split matching Image 4 -->
    <main id="main-content" style="max-width: 1080px; margin: 0 auto; padding: 72px 32px 96px;">
      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
          gap: 56px;
          align-items: center;
        "
      >
        <!-- Left Column: Role Details Summary -->
        <section id="login-role-summary" style="display: flex; flex-direction: column;">
          <!-- Dynamically populated by login.js -->
        </section>

        <!-- Right Column: Glass Card Form -->
        <section>
          <div
            id="login-glass-card"
            class="glass-card card-spotlight"
            style="padding: 44px; box-shadow: var(--shadow-md); border-radius: var(--r-20);"
          >
            <!-- Card Header matching Image 5 bottom-left -->
            <div style="margin-bottom: 24px;">
              <h2 id="login-card-title" style="font-size: 22px; font-weight: 600; color: var(--fg); margin-bottom: 6px;">Administrator Login</h2>
              <p id="login-card-subtitle" style="font-size: 14px; color: var(--mu); margin: 0;">Enter your credentials to continue.</p>
            </div>

            <!-- Error Banner -->
            <div
              id="login-error-banner"
              style="
                display: none;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;
                background: var(--status-error-bg);
                border: 1px solid var(--status-error-fg);
                border-radius: var(--r-12);
                margin-bottom: 24px;
              "
              role="alert"
            ></div>

            <form id="login-form" novalidate>
              <!-- Username -->
              <div class="form-group" style="margin-bottom: 20px;">
                <label for="login-username" class="form-label" style="font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--fg); display: block;">Username</label>
                <input
                  id="login-username"
                  type="text"
                  class="form-input"
                  placeholder="Enter username"
                  autocomplete="username"
                  required
                />
                <div id="username-error" class="field-error-msg" style="display: none;"></div>
              </div>

              <!-- Password -->
              <div class="form-group" style="margin-bottom: 28px;">
                <label for="login-password" class="form-label" style="font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--fg); display: block;">Password</label>
                <div class="input-wrapper" style="position: relative;">
                  <input
                    id="login-password"
                    type="password"
                    class="form-input"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    style="padding-right: 50px;"
                    required
                  />
                  <button
                    type="button"
                    id="pw-toggle-btn"
                    class="pw-toggle-btn"
                    aria-label="Toggle password visibility"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
                <div id="password-error" class="field-error-msg" style="display: none;"></div>
              </div>

              <!-- Submit Button with Gradient and Glow (Image 4) -->
              <button
                type="submit"
                id="login-submit-btn"
                class="btn btn-primary btn-lg"
                style="width: 100%; margin-bottom: 20px; height: 50px; font-size: 15px; font-weight: 600;"
              >
                <span class="btn-text">Sign in</span>
              </button>

              <!-- Forgot Password Link -->
              <div style="text-align: center; font-size: 14px;">
                <a href="forgot-password.html" style="color: var(--lk); text-decoration: none; font-weight: 500;">
                  Forgot your password?
                </a>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer style="text-align: center; padding: 32px 16px; border-top: 1px solid var(--bd); font-size: 13px; color: var(--mu);">
      <p>© 2026 Nushift. Law, tax and compliance, shifted into one intelligent workspace.</p>
    </footer>

    <script type="module" src="./src/login.js"></script>
  </body>
</html>
