# ---------------------------------------------------------------------------
# Local-First Agent Ecosystem — one-command local stack
#
#   docker compose up --build
#
# Brings up:
#   • ollama  — local LLM inference (llama3.1:8b + nomic-embed-text)
#   • app     — FastAPI backend + the 7-portal React web app on :8000
#
# Then open http://localhost:8000 and sign in with any demo portal account.
#
# Models are pulled automatically on first start (see the `ollama-init`
# one-shot service). The first pull is large (~5 GB) and slow; afterwards
# they persist in the `ollama_models` volume.
# ---------------------------------------------------------------------------

services:
  ollama:
    image: ollama/ollama:latest
    container_name: lfae-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      # Expose to the host so you can also `ollama pull` from the CLI.
      # Remove this block if you want Ollama private to the compose network.
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # GPU support: uncomment for NVIDIA.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull the models the platform needs, then exit.
  ollama-init:
    image: ollama/ollama:latest
    container_name: lfae-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling llama3.1:8b (chat model)..."
        ollama pull llama3.1:8b || true
        echo "Pulling nomic-embed-text (embedding model)..."
        ollama pull nomic-embed-text || true
        echo "Model pull complete."

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lfae-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Reach Ollama over the compose network (not 127.0.0.1).
      LFAE_OLLAMA_URL: http://ollama:11434
      LFAE_HOST: 0.0.0.0
      LFAE_PORT: "8000"
      # Optional real voice provider credentials (Agent 16). Without these
      # it degrades to the simulated provider automatically.
      # TWILIO_ACCOUNT_SID: ""
      # TWILIO_AUTH_TOKEN: ""
      # TWILIO_FROM_NUMBER: ""
    ports:
      - "8000:8000"
    volumes:
      # Knowledge store, ingested documents, audit log, memory — persisted.
      - lfae_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  ollama_models:
  lfae_data: